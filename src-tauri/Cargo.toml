[package]
name = "video-downloader"
version = "0.1.3"
description = "Local desktop video downloader"
authors = ["video-downloader"]
edition = "2021"

[lib]
name = "video_downloader_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "time"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "chrono", "uuid"] }
reqwest = { version = "0.12", features = ["json", "cookies", "rustls-tls", "stream"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
directories = "5"
sanitize-filename = "0.6"
futures-util = "0.3"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.10.1"
sha2 = "0.10"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
